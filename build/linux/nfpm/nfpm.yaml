name: "gemini-web2api"
arch: "${GOARCH}"
platform: "linux"
version: "${VERSION}"
section: "net"
priority: "optional"
maintainer: "Mag1cFall <107487022+Mag1cFall@users.noreply.github.com>"
description: "Gemini Web API proxy and desktop console"
vendor: "Mag1cFall"
homepage: "https://github.com/Mag1cFall/Gemini-Web2API"
license: "MIT"

contents:
  - src: "./bin/gemini-web2api"
    dst: "/usr/bin/gemini-web2api"
  - src: "./build/appicon.png"
    dst: "/usr/share/pixmaps/gemini-web2api.png"
  - src: "./build/linux/gemini-web2api.desktop"
    dst: "/usr/share/applications/gemini-web2api.desktop"

depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4
