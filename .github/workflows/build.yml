name: Build And Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

env:
  GOTOOLCHAIN: local
  WAILS_VERSION: v3.0.0-beta.29

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      numeric: ${{ steps.version.outputs.numeric }}
    steps:
      - id: version
        run: |
          version="${GITHUB_SHA:0:7}"
          numeric=0.0.0
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="$GITHUB_REF_NAME"
            numeric="${version#v}"
            numeric="${numeric%%-*}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "numeric=$numeric" >> "$GITHUB_OUTPUT"

  headless:
    needs: [checks, version]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64]
    env:
      CGO_ENABLED: '0'
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: webui
          path: internal/webui/dist
      - uses: actions/setup-go@v7
        id: go
        with:
          go-version: stable
          cache: false
      - id: cache
        run: echo "key=go-headless-${TARGET/\//-}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.cache.outputs.key }}-${{ github.sha }}
          restore-keys: ${{ steps.cache.outputs.key }}-
      - name: Build Package
        run: |
          export GOOS="${TARGET%/*}" GOARCH="${TARGET#*/}"
          name="gemini-web2api-${VERSION}-${GOOS}-${GOARCH}"
          mkdir -p "dist/$name"
          go build -mod=readonly -tags nomsgpack -trimpath -ldflags="-s -w -X github.com/Mag1cFall/Gemini-Web2API/internal/app.version=${VERSION}" -o "dist/$name/gemini-web2api" ./cmd/gemini-web2api
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          echo "ARTIFACT=packages-headless-${GOOS}-${GOARCH}" >> "$GITHUB_ENV"
      - uses: actions/cache/save@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.cache.outputs.key }}-${{ github.sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT }}
          path: dist/*.tar.gz
          retention-days: 7

  desktop-windows:
    needs: [checks, version]
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: '0'
      VERSION: ${{ needs.version.outputs.version }}
      NUMERIC: ${{ needs.version.outputs.numeric }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: webui
          path: internal/webui/dist
      - uses: actions/setup-go@v7
        id: go
        with:
          go-version: stable
          cache: false
      - uses: actions/cache/restore@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-windows-amd64-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: go-windows-amd64-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
      - name: Install Packaging Tools
        run: go install "github.com/wailsapp/wails/v3/cmd/wails3@$WAILS_VERSION"
      - name: Build Desktop Package
        run: |
          mkdir -p bin dist
          for file in info.json wails.exe.manifest; do
            sed "s/\"0\.0\.0\"/\"$NUMERIC\"/g" "build/windows/$file" > "bin/$file"
          done
          wails3 generate syso -arch amd64 -icon build/windows/icon.ico -manifest bin/wails.exe.manifest -info bin/info.json -out cmd/gemini-web2api/wails_windows_amd64.syso
          name="gemini-web2api-${VERSION}-windows-amd64"
          mkdir -p "dist/$name"
          GOOS=windows GOARCH=amd64 go build -mod=readonly -tags desktop,production,nomsgpack -trimpath -ldflags="-s -w -H windowsgui -X github.com/Mag1cFall/Gemini-Web2API/internal/app.version=${VERSION}" -o "dist/$name/gemini-web2api.exe" ./cmd/gemini-web2api
          (cd dist && 7z a -tzip -bso0 "$name.zip" "$name")
      - uses: actions/cache/save@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-windows-amd64-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: packages-desktop-windows
          path: dist/*.zip
          retention-days: 7

  desktop-macos:
    needs: [checks, version]
    runs-on: macos-15
    env:
      CGO_ENABLED: '1'
      VERSION: ${{ needs.version.outputs.version }}
      NUMERIC: ${{ needs.version.outputs.numeric }}
      CGO_CPPFLAGS: -mmacosx-version-min=12.0
      CGO_LDFLAGS: -mmacosx-version-min=12.0
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: webui
          path: internal/webui/dist
      - uses: actions/setup-go@v7
        id: go
        with:
          go-version: stable
          cache: false
      - uses: actions/cache/restore@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
          key: go-desktop-macos-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: go-desktop-macos-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
      - name: Build App Bundle
        run: |
          for arch in arm64 amd64; do
            GOARCH="$arch" go build -mod=readonly -tags desktop,production,nomsgpack -trimpath -ldflags="-s -w -X github.com/Mag1cFall/Gemini-Web2API/internal/app.version=${VERSION}" -o "bin/gemini-web2api-$arch" ./cmd/gemini-web2api
          done
          lipo -create -output bin/gemini-web2api bin/gemini-web2api-arm64 bin/gemini-web2api-amd64
          app=bin/Gemini-Web2API.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp bin/gemini-web2api "$app/Contents/MacOS/"
          cp build/darwin/icons.icns "$app/Contents/Resources/"
          cp build/darwin/Info.plist "$app/Contents/"
          plutil -replace CFBundleShortVersionString -string "$NUMERIC" "$app/Contents/Info.plist"
          plutil -replace CFBundleVersion -string "$NUMERIC" "$app/Contents/Info.plist"
          codesign --force --deep --sign - "$app"
          mkdir -p dist
          tar -czf "dist/gemini-web2api-desktop-${VERSION}-darwin-universal.tar.gz" -C bin Gemini-Web2API.app
      - uses: actions/cache/save@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
          key: go-desktop-macos-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: packages-desktop-macos
          path: dist/*.tar.gz
          retention-days: 7

  desktop-linux:
    needs: [checks, version]
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: '1'
      VERSION: ${{ needs.version.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: webui
          path: internal/webui/dist
      - uses: actions/setup-go@v7
        id: go
        with:
          go-version: stable
          cache: false
      - uses: actions/cache/restore@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-desktop-linux-${{ matrix.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: go-desktop-linux-${{ matrix.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build Desktop Package
        run: |
          name="gemini-web2api-desktop-${VERSION}-linux-${ARCH}"
          mkdir -p "dist/$name"
          go build -mod=readonly -tags desktop,production,gtk3,nomsgpack -trimpath -ldflags="-s -w -X github.com/Mag1cFall/Gemini-Web2API/internal/app.version=${VERSION}" -o "dist/$name/gemini-web2api" ./cmd/gemini-web2api
          tar -czf "dist/$name.tar.gz" -C dist "$name"
      - uses: actions/cache/save@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-desktop-linux-${{ matrix.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: packages-desktop-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          retention-days: 7

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [headless, desktop-windows, desktop-macos, desktop-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "$RELEASE_TAG" "${flags[@]}"

  docker:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: headless
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: packages-headless-linux-${{ matrix.arch }}
          path: release
      - run: mkdir -p release/linux-${{ matrix.arch }} && tar -xzf release/*.tar.gz --strip-components=1 -C release/linux-${{ matrix.arch }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: release
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  docker-manifest:
    needs: docker
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{raw}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - working-directory: digests
        run: docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") $(printf "${IMAGE}@sha256:%s " *)
        env:
          IMAGE: ${{ steps.image.outputs.name }}
